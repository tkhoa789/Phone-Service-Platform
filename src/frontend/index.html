<!doctype html>
<html lang="vi" class="theme-dark dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSP — Phone Service Platform Enterprise</title>
    <!-- Google Fonts: Plus Jakarta Sans Duy Nhất -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Early Theme Initialization to eliminate FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          var root = document.documentElement;
          root.classList.remove('theme-light', 'theme-dark', 'light', 'dark');
          root.classList.add('theme-' + theme, theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
