openapi: 3.0.3
info:
  title: Phone Store Chain & AI Assistant Management System API
  description: |
    API Contracts for Phone Store Chain Management System integrated with Local AI Assistant.
    
    LƯU Ý ĐỒNG BỘ (CẬP NHẬT TỪ PHASE 8):
    Đây là bản đặc tả cốt lõi ban đầu (Core Blueprint) định nghĩa các endpoint chính. 
    Trong quá trình phát triển thực tế, mã nguồn Backend đã được mở rộng và hoàn thiện tới 26 Controllers 
    (bao gồm các module: Nhập hàng, Chuyển kho, Bảo hành, Khuyến mãi, Thiết lập hệ thống, v.v.).
    Để lấy bản đặc tả (Swagger/OpenAPI 3.0) chi tiết 100% khớp với mã nguồn hiện tại, 
    vui lòng chạy dự án `PSP.API` và truy xuất trực tiếp từ endpoint Swagger (thường là /swagger/v1/swagger.json).
  version: 1.0.0
servers:
  - url: http://localhost:5000/api
    description: Development Server
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates user credentials and returns JWT & Refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: OBJECT
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: Admin@123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseEnvelope'
        '401':
          description: Unauthorized credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /products:
    get:
      tags:
        - Product Catalog
      summary: List Products
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Product list returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponseEnvelope'

    post:
      tags:
        - Product Catalog
      summary: Create new Product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponseEnvelope'

  /inventories/search:
    get:
      tags:
        - Inventory Management
      summary: Query stock by variant & warehouse
      security:
        - BearerAuth: []
      parameters:
        - name: warehouseId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: sku
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Stock quantities returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponseEnvelope'

  /sales-orders:
    post:
      tags:
        - Sales Management
      summary: Create sales transaction
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderRequest'
      responses:
        '201':
          description: Order created and stock updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponseEnvelope'

  /repair-tickets:
    post:
      tags:
        - Repair Management
      summary: Open a new Repair Ticket
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairTicketRequest'
      responses:
        '201':
          description: Ticket registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairResponseEnvelope'

  /ai/chat:
    post:
      tags:
        - AI Assistant
      summary: Chat with AI Assistant (Synchronous/Stream)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - conversationId
                - message
              properties:
                conversationId:
                  type: string
                  format: uuid
                  example: "4a6d7c11-82b5-4b57-a6cb-9259a4c84dc1"
                message:
                  type: string
                  example: "Kiểm tra tồn kho iPhone 15 Pro Max tại chi nhánh Quận 1"
      responses:
        '200':
          description: AI response generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponseEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    # Standard Response Envelope
    ResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errorCode:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time

    LoginResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                tokenType:
                  type: string
                  example: Bearer
                expiresIn:
                  type: integer
                  example: 3600

    ErrorResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    ProductRequest:
      type: object
      required:
        - categoryId
        - brandId
        - code
        - name
      properties:
        categoryId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        code:
          type: string
          example: I15PM
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
          example: Apple smartphone model 2023

    ProductResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                code:
                  type: string
                name:
                  type: string
                categoryId:
                  type: string
                  format: uuid
                brandId:
                  type: string
                  format: uuid

    ProductListResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  name:
                    type: string

    InventoryResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  warehouseId:
                    type: string
                    format: uuid
                  warehouseName:
                    type: string
                  productVariantId:
                    type: string
                    format: uuid
                  sku:
                    type: string
                  quantity:
                    type: integer

    SalesOrderRequest:
      type: object
      required:
        - customerId
        - branchId
        - items
      properties:
        customerId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        voucherCode:
          type: string
          nullable: true
        items:
          type: array
          items:
            type: object
            required:
              - productVariantId
              - quantity
            properties:
              productVariantId:
                type: string
                format: uuid
              imei:
                type: string
                nullable: true
              quantity:
                type: integer
                example: 1
              unitPrice:
                type: number
                example: 29990000

    OrderResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                orderId:
                  type: string
                  format: uuid
                orderCode:
                  type: string
                status:
                  type: string
                  example: PAID
                totalAmount:
                  type: number

    RepairTicketRequest:
      type: object
      required:
        - customerId
        - productVariantId
        - problemDescription
      properties:
        customerId:
          type: string
          format: uuid
        productVariantId:
          type: string
          format: uuid
        imei:
          type: string
          nullable: true
        problemDescription:
          type: string
          example: Broken screen glass, touchscreen works
        estimatedCost:
          type: number
          example: 1500000

    RepairResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                ticketId:
                  type: string
                  format: uuid
                ticketCode:
                  type: string
                status:
                  type: string
                  example: RECEIVED

    AIChatResponseEnvelope:
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                responseMessage:
                  type: string
                  example: "Tồn kho của iPhone 15 Pro Max tại chi nhánh Quận 1 hiện còn 15 máy."
                usedTools:
                  type: array
                  items:
                    type: string
                    example: getInventoryStatus
